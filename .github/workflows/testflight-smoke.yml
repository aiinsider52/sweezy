name: testflight-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sweezy/**'
      - 'fastlane/**'
      - '.github/workflows/testflight-smoke.yml'

jobs:
  ios-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # The app targets iOS 26, so CI needs the newest Xcode 26 installed on the runner.
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Build & test
        run: |
          xcodebuild \
            -scheme sweezy \
            -project sweezy/sweezy.xcodeproj \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            test
      - name: Metadata presence check
        run: |
          test -s fastlane/metadata/privacy_url.txt
          test -s fastlane/metadata/terms_url.txt
          test -s fastlane/metadata/en-US/description.txt
          test -s fastlane/metadata/uk/description.txt
          test -s fastlane/metadata/de-DE/description.txt
          test -s docs/asc-app-privacy-answers.md
          test -s docs/testflight-smoke-checklist.md
