previews:
  generation: off

services:
  - type: web
    name: sweezy
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - backend/**
        - shared/openapi.json
        - render.yaml
        - .github/workflows/backend.yml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: CHAT_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://sweezy-admin.onrender.com"]'
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sweezy-chat-realtime
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SETUP_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        value: Sweezy
      # Private S3-compatible media storage (AWS S3 or Cloudflare R2).
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_REGION
        value: auto
      - key: MEDIA_S3_ENDPOINT_URL
        sync: false
      - key: MEDIA_S3_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_S3_PREFIX
        value: media
      - key: MEDIA_SIGNED_URL_TTL_SECONDS
        value: "300"
      # Temporary compatibility mode. Set false after private S3/R2 credentials are configured.
      - key: MEDIA_ALLOW_EPHEMERAL_FALLBACK
        value: "true"
      # Keep false until APNS_KEY_ID / APNS_TEAM_ID / APNS_PRIVATE_KEY are set in the dashboard.
      - key: PUSH_NOTIFICATIONS_ENABLED
        value: "false"
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: APNS_BUNDLE_ID
        value: com.sweezy.mobile
      - key: PUSH_SHOW_MESSAGE_PREVIEW
        value: "false"
      - key: CHAT_OUTBOX_RETENTION_DAYS
        value: "30"
      - key: PUSH_REVOKED_RETENTION_DAYS
        value: "30"
      # Jobs catalog. Set provider values in Render dashboard after partnership approval.
      - key: JOOBLE_API_KEY
        sync: false
      - key: JOOBLE_API_BASE_URL
        value: https://de.jooble.org/api
      - key: JOOBLE_SYNC_QUERIES
        value: software,nurse,driver,warehouse,sales,marketing
      - key: JOOBLE_SYNC_PAGES
        value: "5"
      - key: JOOBLE_RESULTS_PER_PAGE
        value: "50"
      - key: GREENHOUSE_BOARD_TOKENS
        sync: false
      - key: LEVER_SITES
        sync: false
      - key: PERSONIO_COMPANIES
        sync: false
      - key: PERSONIO_FEED_LANGUAGE
        value: de
      - key: JOBS_SYNC_INTERVAL_SEC
        value: "1800"
      - key: JOBS_STALE_AFTER_HOURS
        value: "48"
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      # Incident storage is enabled without Telegram; add credentials in Render to send alerts.
      - key: INCIDENTS_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: INCIDENT_ALERT_DEDUPE_SECONDS
        value: "900"
      - key: INCIDENT_ALERT_MAX_CHARS
        value: "3500"
      - key: INCIDENT_TELEGRAM_TIMEOUT_SECONDS
        value: "3"
      - key: INCIDENT_CRITICAL_TELEMETRY_TYPES
        value: app.crash,security.critical,data_loss

  - type: web
    name: sweezy_admin
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: admin
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    buildFilter:
      paths:
        - admin/**
        - shared/openapi.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 20.19.2
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://sweezy-9xyk.onrender.com/api/v1

  - type: keyvalue
    name: sweezy-chat-realtime
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    # Pub/sub only — persistence not required for chat fan-out.
    persistenceMode: off
