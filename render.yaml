previews:
  generation: off

services:
  - type: web
    name: sweezy
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - backend/**
        - shared/openapi.json
        - render.yaml
        - .github/workflows/backend.yml
    envVars:
      - key: APP_ENV
        value: production
      - key: CHAT_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://sweezy-admin.onrender.com"]'
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sweezy-chat-realtime
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUSH_NOTIFICATIONS_ENABLED
        value: "false"
      - key: PUSH_SHOW_MESSAGE_PREVIEW
        value: "false"
      - key: CHAT_OUTBOX_RETENTION_DAYS
        value: "30"
      - key: PUSH_REVOKED_RETENTION_DAYS
        value: "30"

  - type: web
    name: sweezy_admin
    runtime: node
    plan: free
    branch: main
    rootDir: admin
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    buildFilter:
      paths:
        - admin/**
        - shared/openapi.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://sweezy-9xyk.onrender.com/api/v1

  - type: keyvalue
    name: sweezy-chat-realtime
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
